<!doctype html><html lang="en"><meta charset="utf-8"><title>Curve QA · Browser Controls</title><link rel="stylesheet" href="style.css"><header><span class="pill">BROWSER CONTROLS</span><a href="index.html">Home</a></header><h1>A few real browser jobs.</h1><div class="card"><h2>Download</h2><a id="download" href="sample-download.txt" download="Curve-QA-download.txt">Download the QA text file</a><p class="detail">Expected: native Save panel, then a completed download row.</p></div><div class="card"><h2>Upload picker</h2><label for="file">Choose a disposable local test file<input id="file" type="file"></label><output id="file-name">No file selected.</output><p class="detail">The selected file is not uploaded. The page only displays its name.</p></div><div class="card"><h2>JavaScript dialogs</h2><button id="alert" onclick="alert('Curve QA alert')">Show Alert</button> <button id="confirm" onclick="document.querySelector('#dialog-result').textContent=confirm('Confirm this QA dialog?')?'Confirmed':'Cancelled'">Show Confirm</button> <button id="prompt" onclick="document.querySelector('#dialog-result').textContent=prompt('Enter a QA word','Curve')||'Cancelled'">Show Prompt</button><p id="dialog-result">No dialog action yet.</p></div><script>document.querySelector('#file').addEventListener('change',e=>document.querySelector('#file-name').textContent=e.target.files[0]?.name||'No file selected.');</script></html>
